<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">使う、つくる、手放す</title>
  <desc id="desc">人間の目的を中心に、道具を使い、つくり変え、手放して再び選び直す循環を示す図。</desc>
  <defs>
    <filter id="raised" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-12" dy="-12" stdDeviation="14" flood-color="#FFFFFF" flood-opacity="0.96"/>
      <feDropShadow dx="12" dy="12" stdDeviation="14" flood-color="#B8C2CD" flood-opacity="0.72"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-7" dy="-7" stdDeviation="9" flood-color="#FFFFFF" flood-opacity="0.9"/>
      <feDropShadow dx="7" dy="7" stdDeviation="9" flood-color="#BEC7D1" flood-opacity="0.6"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#5E7ED6"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#E9EEF3"/>
  <text x="800" y="78" text-anchor="middle" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="42" font-weight="700" fill="#26323D">使う、つくる、手放す</text>
  <text x="800" y="119" text-anchor="middle" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="22" font-weight="500" fill="#687681">道具ではなく、人間の目的を関係の中心に置く</text>

  <path d="M710 265 C555 230 386 282 334 405" fill="none" stroke="#5E7ED6" stroke-width="9" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
  <path d="M410 630 C552 744 773 746 917 655" fill="none" stroke="#5E7ED6" stroke-width="9" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
  <path d="M1180 523 C1212 377 1109 268 937 248" fill="none" stroke="#5E7ED6" stroke-width="9" stroke-linecap="round" marker-end="url(#arrowBlue)"/>

  <g transform="translate(800 450)">
    <circle r="142" fill="#E9EEF3" filter="url(#raised)"/>
    <circle r="112" fill="#26323D"/>
    <circle cy="-39" r="28" fill="#E9EEF3"/>
    <path d="M-57 47 Q0 -10 57 47" fill="none" stroke="#E9EEF3" stroke-width="27" stroke-linecap="round"/>
    <text x="0" y="88" text-anchor="middle" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">人間の目的</text>
  </g>

  <g transform="translate(800 204)">
    <rect x="-236" y="-66" width="472" height="150" rx="38" fill="#E9EEF3" filter="url(#raised)"/>
    <circle cx="-154" cy="9" r="46" fill="#5E7ED6"/>
    <path d="M-177 12 L-159 30 L-128 -18" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="-83" y="0" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="34" font-weight="700" fill="#26323D">使う</text>
    <text x="-83" y="42" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="21" font-weight="500" fill="#5E6A75">目的と限界を理解する</text>
  </g>

  <g transform="translate(1150 590)">
    <rect x="-236" y="-66" width="472" height="150" rx="38" fill="#E9EEF3" filter="url(#raised)"/>
    <circle cx="-154" cy="9" r="46" fill="#65977E"/>
    <rect x="-178" y="-15" width="28" height="28" rx="5" fill="#FFFFFF"/>
    <rect x="-144" y="-15" width="28" height="28" rx="5" fill="#FFFFFF" opacity="0.8"/>
    <rect x="-161" y="19" width="28" height="28" rx="5" fill="#FFFFFF" opacity="0.9"/>
    <text x="-83" y="0" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="34" font-weight="700" fill="#26323D">つくる</text>
    <text x="-83" y="42" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="21" font-weight="500" fill="#5E6A75">自分の状況に合わせて変える</text>
  </g>

  <g transform="translate(450 590)">
    <rect x="-236" y="-66" width="472" height="150" rx="38" fill="#E9EEF3" filter="url(#raised)"/>
    <circle cx="-154" cy="9" r="46" fill="#D47B6D"/>
    <path d="M-182 22 C-163 42 -134 42 -115 22" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
    <path d="M-149 -26 V19 M-149 -26 L-168 -7 M-149 -26 L-130 -7" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="-83" y="0" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="34" font-weight="700" fill="#26323D">手放す</text>
    <text x="-83" y="42" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="21" font-weight="500" fill="#5E6A75">別の方法を選べる</text>
  </g>

  <g transform="translate(342 790)">
    <rect width="916" height="74" rx="37" fill="#E9EEF3" filter="url(#soft)"/>
    <text x="458" y="48" text-anchor="middle" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="24" font-weight="700" fill="#26323D">手放したあとも、必要になれば同じ道具や別の道具を選び直せる</text>
  </g>
</svg>
