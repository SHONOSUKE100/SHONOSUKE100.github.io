<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">二つの分水嶺</title>
  <desc id="desc">道具や制度の拡大が人間の能力と自由を高めた後、第二の分水嶺を越えると目的を阻害するようになることを示す曲線図。</desc>
  <defs>
    <filter id="raised" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-10" dy="-10" stdDeviation="13" flood-color="#FFFFFF" flood-opacity="0.96"/>
      <feDropShadow dx="10" dy="10" stdDeviation="13" flood-color="#B9C3CE" flood-opacity="0.7"/>
    </filter>
    <linearGradient id="goodZone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5E7ED6" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#65977E" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="riskZone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D47B6D" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#D47B6D" stop-opacity="0.22"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#26323D"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#E9EEF3"/>
  <text x="800" y="78" text-anchor="middle" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="42" font-weight="700" fill="#26323D">道具の発展と「二つの分水嶺」</text>
  <text x="800" y="119" text-anchor="middle" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="22" font-weight="500" fill="#687681">発展が続けば、効果も増え続けるとは限らない</text>

  <g transform="translate(132 166)">
    <rect width="1336" height="600" rx="38" fill="#E9EEF3" filter="url(#raised)"/>
    <rect x="302" y="54" width="624" height="444" rx="24" fill="url(#goodZone)"/>
    <rect x="926" y="54" width="338" height="444" rx="24" fill="url(#riskZone)"/>

    <path d="M105 498 H1272" fill="none" stroke="#26323D" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M105 498 V75" fill="none" stroke="#26323D" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="1160" y="557" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="21" font-weight="700" fill="#26323D">道具・制度の拡大</text>
    <text x="-295" y="39" transform="rotate(-90)" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="21" font-weight="700" fill="#26323D">人間の能力・自由</text>

    <path d="M115 458 C190 438 250 356 302 275 C390 142 530 124 682 142 C810 157 876 190 926 238 C1015 323 1092 405 1254 456" fill="none" stroke="#5E7ED6" stroke-width="15" stroke-linecap="round"/>
    <path d="M926 238 C1015 323 1092 405 1254 456" fill="none" stroke="#D47B6D" stroke-width="15" stroke-linecap="round"/>

    <line x1="302" y1="54" x2="302" y2="498" stroke="#5E7ED6" stroke-width="4" stroke-dasharray="12 12"/>
    <line x1="926" y1="54" x2="926" y2="498" stroke="#D47B6D" stroke-width="4" stroke-dasharray="12 12"/>
    <circle cx="302" cy="275" r="18" fill="#E9EEF3" stroke="#5E7ED6" stroke-width="9"/>
    <circle cx="926" cy="238" r="18" fill="#E9EEF3" stroke="#D47B6D" stroke-width="9"/>

    <g transform="translate(56 40)">
      <rect width="226" height="96" rx="24" fill="#E9EEF3" filter="url(#raised)"/>
      <text x="113" y="39" text-anchor="middle" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="18" font-weight="700" fill="#687681">発展の初期</text>
      <text x="113" y="70" text-anchor="middle" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="22" font-weight="700" fill="#26323D">能力が拡大する</text>
    </g>
    <g transform="translate(406 40)">
      <rect width="394" height="96" rx="24" fill="#E9EEF3" filter="url(#raised)"/>
      <text x="197" y="39" text-anchor="middle" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="18" font-weight="700" fill="#65977E">二つの分水嶺の間</text>
      <text x="197" y="70" text-anchor="middle" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="22" font-weight="700" fill="#26323D">道具が目的を支える</text>
    </g>
    <g transform="translate(1012 40)">
      <rect width="274" height="96" rx="24" fill="#E9EEF3" filter="url(#raised)"/>
      <text x="137" y="39" text-anchor="middle" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="18" font-weight="700" fill="#D47B6D">逆転した状態</text>
      <text x="137" y="70" text-anchor="middle" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="22" font-weight="700" fill="#26323D">目的を阻害する</text>
    </g>

    <g transform="translate(214 514)">
      <rect width="176" height="58" rx="29" fill="#5E7ED6"/>
      <text x="88" y="37" text-anchor="middle" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">第一の分水嶺</text>
    </g>
    <g transform="translate(829 514)">
      <rect width="194" height="58" rx="29" fill="#D47B6D"/>
      <text x="97" y="37" text-anchor="middle" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">第二の分水嶺</text>
    </g>
  </g>

  <text x="800" y="832" text-anchor="middle" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="25" font-weight="700" fill="#26323D">手段の拡大が、ある地点から本来の目的を侵食し始める</text>
</svg>
