<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">ARC の4つのリスト</title>
  <desc id="desc">左から B1、T1、T2、B2 の順に並ぶ。T1 と T2 が実際にキャッシュにあるページで、合計は容量 c。B1 と B2 は追い出したページの ID だけを覚えるゴースト。T1 と T2 の境目は目標サイズ p によって左右に動く。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Hiragino Sans", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; fill: #26323D; }
    .h { font-size: 40px; font-weight: 700; }
    .m { font-size: 26px; font-weight: 700; }
    .s { font-size: 22px; fill: #52606D; }
    .mono { font-family: Menlo, "SFMono-Regular", monospace; font-size: 22px; }
  </style>
  <rect width="1600" height="760" fill="#F4F6F8"/>

  <!-- cache bracket -->
  <path d="M400 90 L400 70 L1200 70 L1200 90" fill="none" stroke="#26323D" stroke-width="2.5"/>
  <text x="800" y="54" text-anchor="middle" class="m">実際にキャッシュにあるページ（合計 = 容量 c）</text>

  <!-- B1 -->
  <rect x="60" y="120" width="320" height="300" rx="18" fill="none" stroke="#B45309" stroke-width="2.5" stroke-dasharray="12 8"/>
  <text x="220" y="185" text-anchor="middle" class="h" style="fill:#B45309">B1</text>
  <text x="220" y="228" text-anchor="middle" class="m">T1 のゴースト</text>
  <text x="220" y="268" text-anchor="middle" class="s">T1 から追い出した</text>
  <text x="220" y="298" text-anchor="middle" class="s">ページの ID だけ</text>
  <g class="mono"><text x="220" y="370" text-anchor="middle" style="fill:#B45309">id  id  id</text></g>

  <!-- T1 -->
  <rect x="400" y="120" width="380" height="300" rx="18" fill="#FDF3E3" stroke="#B45309" stroke-width="2.5"/>
  <text x="590" y="185" text-anchor="middle" class="h" style="fill:#B45309">T1</text>
  <text x="590" y="228" text-anchor="middle" class="m">最近の組</text>
  <text x="590" y="268" text-anchor="middle" class="s">1回だけ使われたページ</text>
  <g>
    <rect x="440" y="320" width="90" height="70" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/>
    <rect x="545" y="320" width="90" height="70" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/>
    <rect x="650" y="320" width="90" height="70" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/>
  </g>

  <!-- boundary -->
  <line x1="800" y1="100" x2="800" y2="450" stroke="#0F766E" stroke-width="6"/>

  <!-- T2 -->
  <rect x="820" y="120" width="380" height="300" rx="18" fill="#E6F2F1" stroke="#0F766E" stroke-width="2.5"/>
  <text x="1010" y="185" text-anchor="middle" class="h" style="fill:#0F766E">T2</text>
  <text x="1010" y="228" text-anchor="middle" class="m">常連の組</text>
  <text x="1010" y="268" text-anchor="middle" class="s">2回以上使われたページ</text>
  <g>
    <rect x="860" y="320" width="90" height="70" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
    <rect x="965" y="320" width="90" height="70" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
    <rect x="1070" y="320" width="90" height="70" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  </g>

  <!-- B2 -->
  <rect x="1220" y="120" width="320" height="300" rx="18" fill="none" stroke="#0F766E" stroke-width="2.5" stroke-dasharray="12 8"/>
  <text x="1380" y="185" text-anchor="middle" class="h" style="fill:#0F766E">B2</text>
  <text x="1380" y="228" text-anchor="middle" class="m">T2 のゴースト</text>
  <text x="1380" y="268" text-anchor="middle" class="s">T2 から追い出した</text>
  <text x="1380" y="298" text-anchor="middle" class="s">ページの ID だけ</text>
  <g class="mono"><text x="1380" y="370" text-anchor="middle" style="fill:#0F766E">id  id  id</text></g>

  <!-- p slider -->
  <path d="M640 500 L960 500" fill="none" stroke="#0F766E" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="800" y="548" text-anchor="middle" class="m">境目は目標サイズ p で左右に動く</text>

  <!-- explanations -->
  <rect x="60" y="590" width="700" height="130" rx="16" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/>
  <text x="90" y="638" class="m">B1 に当たった ＝ 最近の組を追い出しすぎた</text>
  <text x="90" y="684" class="s">→ p を増やし、T1 の取り分を広げる</text>
  <rect x="840" y="590" width="700" height="130" rx="16" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="870" y="638" class="m">B2 に当たった ＝ 常連を追い出しすぎた</text>
  <text x="870" y="684" class="s">→ p を減らし、T2 の取り分を広げる</text>
</svg>
