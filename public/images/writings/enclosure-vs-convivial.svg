<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">囲い込む道具と自由を広げる道具</title>
  <desc id="desc">変更や離脱ができない囲い込む道具と、選び、作り変え、移動できるコンヴィヴィアルな道具を左右で比較した図。</desc>
  <defs>
    <filter id="raised" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-11" dy="-11" stdDeviation="14" flood-color="#FFFFFF" flood-opacity="0.96"/>
      <feDropShadow dx="11" dy="11" stdDeviation="14" flood-color="#B8C2CD" flood-opacity="0.72"/>
    </filter>
    <linearGradient id="recess" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D9E0E6"/>
      <stop offset="0.52" stop-color="#E9EEF3"/>
      <stop offset="1" stop-color="#FAFBFC"/>
    </linearGradient>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#26323D"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#65977E"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#E9EEF3"/>
  <text x="800" y="78" text-anchor="middle" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="42" font-weight="700" fill="#26323D">道具は、選択肢を閉じることも広げることもできる</text>
  <text x="800" y="119" text-anchor="middle" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="22" font-weight="500" fill="#687681">違いは機能の数ではなく、使い手が関係に参加できるか</text>

  <g transform="translate(80 168)">
    <rect width="690" height="620" rx="40" fill="url(#recess)" stroke="#D2DAE1" stroke-width="3"/>
    <rect x="42" y="40" width="606" height="76" rx="38" fill="#E9EEF3"/>
    <circle cx="86" cy="78" r="18" fill="#D47B6D"/>
    <text x="122" y="89" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="31" font-weight="700" fill="#26323D">囲い込む道具</text>

    <g transform="translate(345 278)">
      <rect x="-88" y="-70" width="176" height="140" rx="32" fill="#D47B6D" filter="url(#raised)"/>
      <path d="M-34 -8 V-26 C-34 -66 34 -66 34 -26 V-8" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round"/>
      <rect x="-46" y="-8" width="92" height="66" rx="16" fill="#FFFFFF" opacity="0.94"/>
      <circle cx="0" cy="20" r="10" fill="#D47B6D"/>
      <path d="M0 30 V42" stroke="#D47B6D" stroke-width="8" stroke-linecap="round"/>
    </g>

    <g fill="none" stroke="#26323D" stroke-width="8" stroke-linecap="round" marker-end="url(#arrowDark)">
      <path d="M105 204 C166 211 198 230 246 257"/>
      <path d="M104 346 C165 340 198 325 246 300"/>
      <path d="M345 447 V368"/>
      <path d="M586 270 C520 270 486 271 445 275"/>
    </g>
    <g fill="#E9EEF3" stroke="#D47B6D" stroke-width="7">
      <circle cx="88" cy="198" r="30"/>
      <circle cx="88" cy="352" r="30"/>
      <circle cx="345" cy="466" r="30"/>
      <circle cx="604" cy="270" r="30"/>
    </g>
    <path d="M73 198 H103 M88 183 V213 M73 337 L103 367 M103 337 L73 367 M330 466 H360 M589 255 L619 285 M619 255 L589 285" stroke="#D47B6D" stroke-width="7" stroke-linecap="round"/>

    <g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="21" font-weight="700" fill="#5E6A75">
      <text x="76" y="546">使い方が固定される</text>
      <text x="373" y="546">変更できない</text>
      <text x="76" y="588">移動できない</text>
      <text x="373" y="588">使わない選択がない</text>
    </g>
    <g fill="#D47B6D">
      <circle cx="57" cy="539" r="6"/><circle cx="354" cy="539" r="6"/>
      <circle cx="57" cy="581" r="6"/><circle cx="354" cy="581" r="6"/>
    </g>
  </g>

  <g transform="translate(830 168)">
    <rect width="690" height="620" rx="40" fill="#E9EEF3" filter="url(#raised)"/>
    <rect x="42" y="40" width="606" height="76" rx="38" fill="#E9EEF3"/>
    <circle cx="86" cy="78" r="18" fill="#65977E"/>
    <text x="122" y="89" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="31" font-weight="700" fill="#26323D">自由を広げる道具</text>

    <g transform="translate(345 278)">
      <circle r="92" fill="#E9EEF3" filter="url(#raised)"/>
      <circle cy="-22" r="25" fill="#26323D"/>
      <path d="M-48 52 Q0 3 48 52" fill="none" stroke="#26323D" stroke-width="23" stroke-linecap="round"/>
      <text x="0" y="128" text-anchor="middle" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="20" font-weight="700" fill="#26323D">使い手の目的</text>
    </g>

    <g fill="#E9EEF3" filter="url(#raised)">
      <rect x="84" y="184" width="118" height="92" rx="25"/>
      <rect x="488" y="174" width="118" height="92" rx="25"/>
      <rect x="104" y="390" width="118" height="92" rx="25"/>
      <rect x="468" y="390" width="118" height="92" rx="25"/>
    </g>
    <g fill="none" stroke="#65977E" stroke-width="8" stroke-linecap="round" marker-end="url(#arrowGreen)">
      <path d="M214 230 C245 239 261 247 279 258"/>
      <path d="M476 222 C449 233 432 242 412 255"/>
      <path d="M223 410 C255 392 273 380 293 366"/>
      <path d="M456 414 C430 393 415 382 397 367"/>
      <path d="M586 435 C632 435 642 398 642 352"/>
    </g>
    <g stroke="#5E7ED6" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M115 230 H171 M143 202 V258"/>
      <path d="M516 220 L545 191 L574 220 L545 249 Z"/>
      <path d="M132 435 L161 406 L190 435 L161 464 Z"/>
      <path d="M501 435 H553 M501 415 H553 M501 455 H538"/>
    </g>
    <path d="M631 352 L648 335 L665 352" fill="none" stroke="#65977E" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="21" font-weight="700" fill="#5E6A75">
      <text x="76" y="546">自分で選べる</text>
      <text x="373" y="546">作り変えられる</text>
      <text x="76" y="588">別の方法へ移れる</text>
      <text x="373" y="588">必要なら手放せる</text>
    </g>
    <g fill="#65977E">
      <circle cx="57" cy="539" r="6"/><circle cx="354" cy="539" r="6"/>
      <circle cx="57" cy="581" r="6"/><circle cx="354" cy="581" r="6"/>
    </g>
  </g>

  <text x="800" y="844" text-anchor="middle" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="25" font-weight="700" fill="#26323D">道具の価値は、使い手の選択肢をどれだけ広げるかに表れる</text>
</svg>
