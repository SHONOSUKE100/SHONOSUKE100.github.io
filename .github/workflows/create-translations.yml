name: Create translated content

on:
  push:
    branches: [main]
    paths:
      - 'src/content/writings/**/*.md'
      - 'src/content/memories/**/*.md'
  workflow_dispatch:
    inputs:
      direction:
        description: 'Choose the source language to translate from'
        required: true
        default: en-to-ja
        type: choice
        options:
          - en-to-ja
          - ja-to-en
      mode:
        description: 'Translate only outdated counterparts, or force selected files'
        required: true
        default: outdated
        type: choice
        options:
          - outdated
          - force
      files:
        description: 'Required for force mode. Comma- or newline-separated source Markdown paths.'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  create-translations:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check Gemini API key
        id: key
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping translation: GEMINI_API_KEY is not configured."
          fi
      - name: Find new content after a push
        id: pushed-files
        if: github.event_name == 'push'
        run: |
          files="$(git diff --name-only --diff-filter=A HEAD^ HEAD -- 'src/content/writings/**/*.md' 'src/content/memories/**/*.md')"
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$files" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      - name: Find outdated counterparts for manual translation
        id: manual-files
        if: github.event_name == 'workflow_dispatch'
        env:
          MODE: ${{ inputs.mode }}
          FILES: ${{ inputs.files }}
          DIRECTION: ${{ inputs.direction }}
        run: |
          if [ "$MODE" = "force" ]; then
            if [ -z "$FILES" ]; then
              echo "::error::files is required when mode is force."
              exit 1
            fi
            files="$(printf '%s' "$FILES" | tr ',' '\n' | sed '/^[[:space:]]*$/d')"
          else
            files="$(node scripts/find-translation-updates.mjs "$DIRECTION")"
          fi
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$files" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      - name: Generate translation counterparts
        id: translate
        if: steps.key.outputs.available == 'true' && (steps.pushed-files.outputs.files != '' || steps.manual-files.outputs.files != '')
        run: |
          files="${{ steps.pushed-files.outputs.files }}${{ steps.manual-files.outputs.files }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node scripts/translate-content.mjs --overwrite $files
          else
            node scripts/translate-content.mjs $files
          fi
          echo "generated=true" >> "$GITHUB_OUTPUT"
      - name: Create translation pull request
        if: steps.translate.outputs.generated == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'content: add generated translations'
          branch: automation/content-translations
          delete-branch: true
          title: 'content: add generated translations'
          body: 'Gemini generated missing or outdated Writing / Memory translations. Please review the changes before merging.'
